---
all:
  vars:
    ansible_connection: community.docker.docker
    ansible_user: root

    topology_l_client_ip: 10.0.1.10
    topology_l_server_ip: 10.0.2.10
    topology_l_management_ip: 10.0.99.10
    topology_l_dmz_ip: 10.0.3.10
    topology_l_sensors_ip: 10.0.4.10

  children:
    topology_l_routers:
      hosts:
        r1:
          ansible_host: clab-thesis-net-l-r1
        r2:
          ansible_host: clab-thesis-net-l-r2
        r3:
          ansible_host: clab-thesis-net-l-r3

    topology_l_hosts:
      hosts:
        h-client:
          ansible_host: clab-thesis-net-l-h-client
        h-server:
          ansible_host: clab-thesis-net-l-h-server
        h-mgmt:
          ansible_host: clab-thesis-net-l-h-mgmt
        h-dmz:
          ansible_host: clab-thesis-net-l-h-dmz
        h-sensors:
          ansible_host: clab-thesis-net-l-h-sensors
