frr version 9.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 description link-to-r1
 ip address 10.0.12.2/30
!
interface eth2
 description server-segment
 ip address 10.0.2.1/24
!
interface eth3
 description management-segment
 ip address 10.0.99.1/24
!
ip forwarding
!
! Reach the client segment via r1
ip route 10.0.1.0/24 10.0.12.1
!
line vty
!
