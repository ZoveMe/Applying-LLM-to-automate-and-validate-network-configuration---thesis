frr version 9.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 description client-segment
 ip address 10.0.1.1/24
!
interface eth2
 description link-to-r2
 ip address 10.0.12.1/30
!
ip forwarding
!
! Reach the far-side segments via r2
ip route 10.0.2.0/24 10.0.12.2
ip route 10.0.99.0/24 10.0.12.2
!
line vty
!
