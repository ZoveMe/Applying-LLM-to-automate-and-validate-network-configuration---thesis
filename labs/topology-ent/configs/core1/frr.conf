! core1 - enterprise lab
frr version 9.1
frr defaults traditional
hostname core1
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 description to core2
 ip address 10.0.0.1/30
!
interface eth2
 description to edge-hq
 ip address 10.0.0.5/30
!
interface eth3
 description to edge-br
 ip address 10.0.0.13/30
!
interface eth4
 description to fw-dmz
 ip address 10.0.0.21/30
!
router ospf
 ospf router-id 10.255.0.1
 network 10.0.0.0/30 area 0
 network 10.0.0.4/30 area 0
 network 10.0.0.12/30 area 0
 network 10.0.0.20/30 area 0
 network 10.255.0.1/32 area 0
!
line vty
!
