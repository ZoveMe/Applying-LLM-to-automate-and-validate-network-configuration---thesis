! fw-dmz - enterprise lab
frr version 9.1
frr defaults traditional
hostname fw-dmz
service integrated-vtysh-config
!
ip forwarding
!
interface lo
 ip address 10.255.0.5/32
!
interface eth1
 description to core1
 ip address 10.0.0.22/30
!
interface eth2
 description VLAN 30 - DMZ
 ip address 10.30.30.1/24
!
router ospf
 ospf router-id 10.255.0.5
 network 10.0.0.20/30 area 0
 network 10.30.30.0/24 area 0
 network 10.255.0.5/32 area 0
!
line vty
!
