# Лабораторија со градба каква што се среќава во претпријатие.
# Пет рутери со OSPF, удвоено јадро, три кориснички сегменти и DMZ.
#
# Распоредување:
#   sudo clab deploy -t topology-ent.clab.yml
#   bash apply-policy.sh

name: thesis-net-ent

topology:
  nodes:
    core1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/core1/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    core2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/core2/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    edge-hq:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/edge-hq/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    edge-br:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/edge-br/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    fw-dmz:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - configs/fw-dmz/frr.conf:/etc/frr/frr.conf
        - configs/daemons:/etc/frr/daemons
    sw-hq:
      kind: linux
      image: alpine:latest
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth1 up
        - ip link set eth2 master br0
        - ip link set eth2 up
        - ip link set eth3 master br0
        - ip link set eth3 up
    sw-br:
      kind: linux
      image: alpine:latest
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth1 up
        - ip link set eth2 master br0
        - ip link set eth2 up
    sw-dmz:
      kind: linux
      image: alpine:latest
      exec:
        - ip link add br0 type bridge
        - ip link set br0 up
        - ip link set eth1 master br0
        - ip link set eth1 up
        - ip link set eth2 master br0
        - ip link set eth2 up
        - ip link set eth3 master br0
        - ip link set eth3 up
    pc-hq1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.10.11/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.10.10.1 dev eth1
    pc-hq2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.10.12/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.10.10.1 dev eth1
    pc-mgmt:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.10.99.11/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.10.99.1 dev eth1
    pc-br1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.20.20.11/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.20.20.1 dev eth1
    srv-web:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.30.30.11/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.30.30.1 dev eth1
    srv-db:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.30.30.12/24 dev eth1
        - ip route replace 10.0.0.0/8 via 10.30.30.1 dev eth1

  links:
    - endpoints: ["core1:eth1", "core2:eth1"]
    - endpoints: ["core1:eth2", "edge-hq:eth1"]
    - endpoints: ["core2:eth2", "edge-hq:eth2"]
    - endpoints: ["core1:eth3", "edge-br:eth1"]
    - endpoints: ["core2:eth3", "edge-br:eth2"]
    - endpoints: ["core1:eth4", "fw-dmz:eth1"]
    - endpoints: ["edge-hq:eth3", "sw-hq:eth1"]
    - endpoints: ["edge-hq:eth4", "pc-mgmt:eth1"]
    - endpoints: ["edge-br:eth3", "sw-br:eth1"]
    - endpoints: ["fw-dmz:eth2", "sw-dmz:eth1"]
    - endpoints: ["sw-hq:eth2", "pc-hq1:eth1"]
    - endpoints: ["sw-hq:eth3", "pc-hq2:eth1"]
    - endpoints: ["sw-br:eth2", "pc-br1:eth1"]
    - endpoints: ["sw-dmz:eth2", "srv-web:eth1"]
    - endpoints: ["sw-dmz:eth3", "srv-db:eth1"]
