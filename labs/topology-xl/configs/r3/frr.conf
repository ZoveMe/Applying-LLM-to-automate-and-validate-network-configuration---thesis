frr version 9.1
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 description transit-to-r1
 ip address 10.0.13.2/30
!
interface eth2
 description transit-to-r2
 ip address 10.0.23.2/30
!
interface eth3
 description management-segment-via-sw3
 ip address 10.0.99.1/24
!
ip forwarding
!
! Client segment sits behind r1; server segment sits behind r2.
ip route 10.0.1.0/24 10.0.13.1
ip route 10.0.2.0/24 10.0.23.1
!
line vty
!
