frr version 9.1
frr defaults traditional
hostname r2
service integrated-vtysh-config
!
interface eth1
 description transit-to-r1
 ip address 10.0.12.2/30
!
interface eth2
 description server-segment-via-sw2
 ip address 10.0.2.1/24
!
interface eth3
 description transit-to-r3
 ip address 10.0.23.1/30
!
ip forwarding
!
! Client segment sits behind r1; management sits behind r3.
ip route 10.0.1.0/24 10.0.12.1
ip route 10.0.99.0/24 10.0.23.2
!
line vty
!
