frr version 9.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 description client-segment-via-sw1
 ip address 10.0.1.1/24
!
interface eth2
 description transit-to-r2
 ip address 10.0.12.1/30
!
interface eth3
 description transit-to-r3
 ip address 10.0.13.1/30
!
ip forwarding
!
! Server segment sits behind r2; management sits behind r3.
ip route 10.0.2.0/24 10.0.12.2
ip route 10.0.99.0/24 10.0.13.2
!
! Applied firewall rule (iptables -S FORWARD):
! -A FORWARD -s 10.0.1.0/24 -d 10.0.99.0/24 -j DROP
!
line vty
!
