frr version 9.1
frr defaults traditional
hostname r3
service integrated-vtysh-config
!
interface eth1
 description link-to-r2
 ip address 10.0.23.2/30
!
interface eth2
 description dmz-segment
 ip address 10.0.3.1/24
!
interface eth3
 description sensors-segment
 ip address 10.0.4.1/24
!
ip forwarding
!
! Reach the client-side segments via r2
ip route 10.0.1.0/24 10.0.23.1
ip route 10.0.2.0/24 10.0.23.1
ip route 10.0.99.0/24 10.0.23.1
!
! NOTE: 10.0.5.0/24 is reserved for future lab expansion, do not configure.
!
line vty
!
