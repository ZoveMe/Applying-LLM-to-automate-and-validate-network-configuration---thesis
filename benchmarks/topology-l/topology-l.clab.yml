name: thesis-net-l

# LARGER benchmark topology (optional live deployment).
# Built for the scaled EXPLAIN benchmark; the thesis-core lab is unchanged.
#   h-client --- r1 --- r2 --- r3 --- h-dmz
#                       |  \         \-- h-sensors
#                h-server  h-mgmt
# Segments: client 10.0.1.0/24 | server 10.0.2.0/24 | management 10.0.99.0/24
#           dmz 10.0.3.0/24    | sensors 10.0.4.0/24
# Transits: r1-r2 10.0.12.0/30 | r2-r3 10.0.23.0/30
#
# NOTE: the EXPLAIN benchmark itself is OFFLINE — it reads the config files
# directly and never requires this topology to be running.

topology:
  nodes:
    r1:
      kind: linux
      image: quay.io/frrouting/frr:9.1.1
      binds:
        - configs/r1/frr.conf:/etc/frr/frr.conf
        - ../../configs/daemons:/etc/frr/daemons
    r2:
      kind: linux
      image: quay.io/frrouting/frr:9.1.1
      binds:
        - configs/r2/frr.conf:/etc/frr/frr.conf
        - ../../configs/daemons:/etc/frr/daemons
    r3:
      kind: linux
      image: quay.io/frrouting/frr:9.1.1
      binds:
        - configs/r3/frr.conf:/etc/frr/frr.conf
        - ../../configs/daemons:/etc/frr/daemons

    h-client:
      kind: linux
      image: alpine:3.20.10
      exec:
        - ip addr add 10.0.1.10/24 dev eth1
        - ip route add 10.0.0.0/16 via 10.0.1.1
    h-server:
      kind: linux
      image: alpine:3.20.10
      exec:
        - ip addr add 10.0.2.10/24 dev eth1
        - ip route add 10.0.0.0/16 via 10.0.2.1
    h-mgmt:
      kind: linux
      image: alpine:3.20.10
      exec:
        - ip addr add 10.0.99.10/24 dev eth1
        - ip route add 10.0.0.0/16 via 10.0.99.1
    h-dmz:
      kind: linux
      image: alpine:3.20.10
      exec:
        - ip addr add 10.0.3.10/24 dev eth1
        - ip route add 10.0.0.0/16 via 10.0.3.1
    h-sensors:
      kind: linux
      image: alpine:3.20.10
      exec:
        - ip addr add 10.0.4.10/24 dev eth1
        - ip route add 10.0.0.0/16 via 10.0.4.1

  links:
    - endpoints: ["h-client:eth1", "r1:eth1"]
    - endpoints: ["r1:eth2", "r2:eth1"]
    - endpoints: ["r2:eth2", "h-server:eth1"]
    - endpoints: ["r2:eth3", "h-mgmt:eth1"]
    - endpoints: ["r2:eth4", "r3:eth1"]
    - endpoints: ["r3:eth2", "h-dmz:eth1"]
    - endpoints: ["r3:eth3", "h-sensors:eth1"]
