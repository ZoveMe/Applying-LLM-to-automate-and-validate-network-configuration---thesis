frr version 9.1
frr defaults traditional
hostname r1
service integrated-vtysh-config
!
interface eth1
 description client-segment
 ip address 10.0.1.1/24
!
interface eth2
 description link-to-r2
 ip address 10.0.12.1/30
!
ip forwarding
!
! Reach the far-side segments via r2
ip route 10.0.2.0/24 10.0.12.2
ip route 10.0.99.0/24 10.0.12.2
ip route 10.0.3.0/24 10.0.12.2
ip route 10.0.4.0/24 10.0.12.2
!
! NOTE: 10.0.5.0/24 is reserved for future lab expansion, do not configure.
!
! Applied firewall rules (iptables -S FORWARD):
! -A FORWARD -s 10.0.1.0/24 -d 10.0.99.0/24 -j DROP
!
line vty
!
